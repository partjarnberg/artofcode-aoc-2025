name: Verify solutions
on:
  push:
    paths: ['days/01/agent/**', '.dockerignore', '.github/workflows/solutions.yml']
  pull_request:
    paths: ['days/01/agent/**', '.dockerignore', '.github/workflows/solutions.yml']
permissions:
  contents: read
jobs:
  day01-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build container and run solution tests
        run: docker build -f days/01/agent/Dockerfile -t advent-day01-agent .
      - name: Verify both parts using our own test data
        run: |
          test "$(printf 'R250\nL200\nR1\nL1\n' | docker run --rm -i advent-day01-agent --part 1)" = '3'
          test "$(printf 'R250\nL200\nR1\nL1\n' | docker run --rm -i advent-day01-agent --part 2)" = '6'
